name: Deploy to Cloudflare Workers
on:
  pull_request:
    branches:
      - master
      - main
      - develop
    types: [closed]
  workflow_dispatch:

jobs:
  deploy:
    name: Wrangler Deploy
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Determine environment
        run: |
          if [[ '${{ github.event.pull_request.base.ref }}' == '${{ github.event.repository.default_branch }}' ]] \
            || [[ '${{ github.event_name }}' == 'workflow_dispatch' && '${{ github.ref_name }}' == '${{ github.event.repository.default_branch }}' ]]; then
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
            echo "DATABASE_NAME=ctftime-bot" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
            echo "DATABASE_NAME=ctftime-bot-staging" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # スキーマ変更を含むデプロイでも順序が狂わないよう、必ず先にマイグレーションを当てる。
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: latest
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply ${{ env.DATABASE_NAME }} --env ${{ env.ENVIRONMENT }} --remote

      # Worker と Web UI をまとめてビルドする。環境は --env ではなく
      # CLOUDFLARE_ENV でビルド時に焼き込む（結果は dist/*/wrangler.json に出る）。
      - name: Build
        run: bun run build
        env:
          CLOUDFLARE_ENV: ${{ env.ENVIRONMENT }}

      # deploy は dist の設定を自動で拾うので、--env も entry point も渡さない。
      - name: Wrangler deploy
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: latest
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

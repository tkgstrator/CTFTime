name = "ctftime-bot"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat_v2"]

# 15 分おきに CTFTime を同期し、リマインダの発火条件を評価する
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ctftime-bot"
database_id = "09dbb18e-60f2-4545-8891-1b497729b1df"
migrations_dir = "migrations"

[vars]
# 新規イベントを告知するチャンネル
DISCORD_CHANNEL_ID = "1551249458237538414"
# 告知フィルタ
ANNOUNCE_MIN_WEIGHT = "0"
ANNOUNCE_ONSITE = "false"
ANNOUNCE_RESTRICTIONS = "Open"
ANNOUNCE_FORMATS = "Jeopardy,Attack-Defense,Hack quest"
LOOKAHEAD_DAYS = "60"
# 起動時に過去どこまで遡って取り込むか。0 で無効。一度埋まれば再実行されない。
# CTFTime は 2011 年から。6000 日で全期間を覆う（2026-09 時点で 2910 件）。
BACKFILL_DAYS = "6000"

# SPA（src/web）を同じ Worker から配信する。
# directory は `vite build` が生成する設定に自動で入るのでここには書かない。
# run_worker_first が要るのは、compatibility_date が 2025-04-01 以降だと
# ブラウザのページ遷移（Sec-Fetch-Mode: navigate）が Worker を通らずアセットを返すため。
# OAuth のコールバックはまさにその遷移で来るので、/auth/* を外すとログインが成立しない。
[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*", "/interactions"]

[observability]
enabled = true
head_sampling_rate = 1

[dev]
port = 13575
ip = "0.0.0.0"
local_protocol = "http"

# --- Environments ---

[env.staging]
name = "ctftime-bot-staging"
workers_dev = true

# top-level の [triggers] は各環境に継承されるため、明示的に空にして打ち消す。
# production と同じチャンネルを見ているので、放っておくと告知が二重に飛ぶ。
# staging の定期実行を試すときは /cdn-cgi/local/scheduled を手で叩く。
[env.staging.triggers]
crons = []

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ctftime-bot-staging"
database_id = "108a351b-72fa-4268-91fa-5f3dced9f3c0"
migrations_dir = "migrations"

[env.staging.vars]
DISCORD_CHANNEL_ID = "1551249458237538414"
ANNOUNCE_MIN_WEIGHT = "0"
ANNOUNCE_ONSITE = "false"
ANNOUNCE_RESTRICTIONS = "Open"
ANNOUNCE_FORMATS = "Jeopardy,Attack-Defense,Hack quest"
LOOKAHEAD_DAYS = "60"
# 起動時に過去どこまで遡って取り込むか。0 で無効。一度埋まれば再実行されない。
# CTFTime は 2011 年から。6000 日で全期間を覆う（2026-09 時点で 2910 件）。
BACKFILL_DAYS = "6000"

[env.staging.assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*", "/interactions"]

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.production]
name = "ctftime-bot"
workers_dev = false

# Web UI の公開先。custom_domain = true にすると wrangler が
# qleap.jp ゾーンに CNAME を作り、証明書の発行までやってくれる。
[[env.production.routes]]
pattern = "ctf.qleap.jp"
custom_domain = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "ctftime-bot"
database_id = "09dbb18e-60f2-4545-8891-1b497729b1df"
migrations_dir = "migrations"

[env.production.vars]
DISCORD_CHANNEL_ID = "1551249458237538414"
ANNOUNCE_MIN_WEIGHT = "0"
ANNOUNCE_ONSITE = "false"
ANNOUNCE_RESTRICTIONS = "Open"
ANNOUNCE_FORMATS = "Jeopardy,Attack-Defense,Hack quest"
LOOKAHEAD_DAYS = "60"
# 起動時に過去どこまで遡って取り込むか。0 で無効。一度埋まれば再実行されない。
# CTFTime は 2011 年から。6000 日で全期間を覆う（2026-09 時点で 2910 件）。
BACKFILL_DAYS = "6000"

[env.production.assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*", "/interactions"]

[env.production.observability]
enabled = true
head_sampling_rate = 1

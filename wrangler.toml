name = "ctftime-bot"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat_v2"]

# 15 分おきに CTFTime を同期し、リマインダの発火条件を評価する
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ctftime-bot"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# 新規イベントを告知するチャンネル
DISCORD_CHANNEL_ID = ""
# 告知フィルタ
ANNOUNCE_MIN_WEIGHT = "0"
ANNOUNCE_ONSITE = "false"
ANNOUNCE_RESTRICTIONS = "Open"
ANNOUNCE_FORMATS = "Jeopardy,Attack-Defense,Hack quest"
LOOKAHEAD_DAYS = "60"

# SPA（src/web）を同じ Worker から配信する。
# directory は `vite build` が生成する設定に自動で入るのでここには書かない。
# run_worker_first が要るのは、compatibility_date が 2025-04-01 以降だと
# ブラウザのページ遷移（Sec-Fetch-Mode: navigate）が Worker を通らずアセットを返すため。
# OAuth のコールバックはまさにその遷移で来るので、/auth/* を外すとログインが成立しない。
[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*", "/interactions"]

[observability]
enabled = true
head_sampling_rate = 1

[dev]
port = 8787
ip = "0.0.0.0"
local_protocol = "http"

# --- Environments ---

[env.staging]
name = "ctftime-bot-staging"
workers_dev = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ctftime-bot-staging"
database_id = "REPLACE_WITH_STAGING_D1_DATABASE_ID"
migrations_dir = "migrations"

[env.staging.vars]
DISCORD_CHANNEL_ID = ""
ANNOUNCE_MIN_WEIGHT = "0"
ANNOUNCE_ONSITE = "false"
ANNOUNCE_RESTRICTIONS = "Open"
ANNOUNCE_FORMATS = "Jeopardy,Attack-Defense,Hack quest"
LOOKAHEAD_DAYS = "60"

[env.staging.assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*", "/interactions"]

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.production]
name = "ctftime-bot"
workers_dev = false

[[env.production.d1_databases]]
binding = "DB"
database_name = "ctftime-bot"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[env.production.vars]
DISCORD_CHANNEL_ID = ""
ANNOUNCE_MIN_WEIGHT = "0"
ANNOUNCE_ONSITE = "false"
ANNOUNCE_RESTRICTIONS = "Open"
ANNOUNCE_FORMATS = "Jeopardy,Attack-Defense,Hack quest"
LOOKAHEAD_DAYS = "60"

[env.production.assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*", "/interactions"]

[env.production.observability]
enabled = true
head_sampling_rate = 1
